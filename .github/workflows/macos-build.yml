name: macos-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Toolchain
        run: |
          set -x
          uname -a
          sw_vers
          xcrun swiftc --version
          csrutil status || true

      - name: Install
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Filter checks
        run: /bin/sh scripts/check-filter.sh

      - name: Build Universal DMG
        run: npm run build

      - name: Verify universal
        run: |
          lipo -archs build/ca-local-services
          ls -la dist

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ca-control-macos-universal-dmg
          path: |
            dist/**/*.dmg
            dist/**/*.blockmap
            dist/**/*.yml
          if-no-files-found: warn
          retention-days: 14
